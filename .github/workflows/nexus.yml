          curl -fsS --retry 3 -o .nexus-text-regex-ratchet.mjs https://raw.githubusercontent.com/scores-patch-points/scores-patch-points/main/nexus/guards/text-regex-ratchet.mjs
          if [ -f gym/text-regex-baseline.jsonl ] || [ -f text-regex-baseline.jsonl ]; then node .nexus-text-regex-ratchet.mjs; else
