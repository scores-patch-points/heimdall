<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heimdall</title>

<style>
:root{--blue:#6fa6cb;--copper:#cf955c;--violet:#9f82c6;--bg:#241a3a;--panel:#2c2148;--bar:#1f1633;--ink:#e8e1f4;--mute:#b8aed3;--soft:#d4c6f0;--line:#3d3160;--dot:#3a2f5c;--wire:#6b6290;--accent:#6fa6cb;--accentDk:#8fbbd9;--warn:#cf955c;--warnBg:#3b2a33;--okBg:#223a55;--dark:#1b1330;--darkIn:#2c2148;--darkTx:#b8aed3;--chip:#2c2148}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Outfit,ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.mono,.lbl,.steps,.tab .n{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}.mono{font-size:12px;font-weight:500}
.glyph{display:inline-block;width:1.2em;text-align:center;margin-right:2px}
.top{display:flex;align-items:center;gap:8px 20px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--bar);flex-wrap:wrap}
.top b{font-size:15px}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;color:var(--soft)}
.tab.on{background:var(--violet);color:#1b1330;font-weight:600}.tab .n{margin-left:6px;color:var(--warn);font-weight:600}.tab.on .n{color:#1b1330}
.sp{flex:1}.pane{padding:28px;display:flex;flex-direction:column;gap:20px;max-width:1100px;width:100%}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-size:24px;font-weight:600;margin:0;text-wrap:pretty}.lead{color:var(--soft);max-width:640px;line-height:1.5;margin:6px 0 0}
.board{overflow:auto;padding:28px;border:1px solid var(--line);border-radius:14px;background-color:#201733;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
.cols{display:grid;grid-template-columns:minmax(200px,1fr) minmax(240px,1.1fr) minmax(200px,1fr);gap:28px;min-width:740px}.col{display:flex;flex-direction:column;gap:10px}
.node{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.node.on{border-color:var(--violet)}.node.warn{border-color:var(--copper)}
.node .t{font-weight:600}.node .s{font-size:12px;color:var(--mute);margin-top:2px}.node .st{font-size:12px;margin-top:2px;color:var(--accent)}.node .st.w{color:var(--warn)}
.src::after,.dst::before{content:"";position:absolute;top:50%;width:28px;height:2px;background:var(--wire)}.src::after{right:-30px}.dst::before{left:-30px}
.add{border:1px dashed var(--wire);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;color:var(--accent);cursor:pointer;background:var(--bar)}
.rec{flex:1;background:var(--dark);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rec .big{font-size:18px;font-weight:600}.rec .m{font-size:13px;color:var(--darkTx)}.rec .in{background:var(--darkIn);border-radius:8px;padding:10px 12px}
.rec .held{background:var(--warnBg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:500;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.line{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}.line span:first-child{flex:0 0 200px}.line span:last-child{flex:1 1 200px;color:var(--soft)}
.btn{height:38px;padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:#1b1330;font-weight:600;font:inherit;font-weight:500;cursor:pointer}.btn.g{background:var(--panel);color:var(--ink);border:1px solid var(--dot)}.btn:disabled{opacity:.5;cursor:default}
input[type=text]{flex:1;min-width:240px;height:38px;border-radius:8px;border:1px solid var(--dot);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 16px}.row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.pill{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--okBg);color:var(--accentDk)}.pill.w{background:var(--warnBg);color:var(--warn)}
.n1{flex:0 0 90px;font-size:20px;font-weight:600}.n1.w{color:var(--warn)}.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kind{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 14px;font-weight:500;cursor:pointer}.kind:hover,.kind.on{border-color:var(--accent)}.kind small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
.needs{margin-top:auto;border-top:1px solid var(--line);background:var(--bar);padding:14px 28px;display:flex;flex-direction:column;gap:6px}.needs div{display:flex;gap:6px 16px;flex-wrap:wrap}.needs .mono{flex:0 1 340px}.needs span:last-child{flex:1 1 260px;color:var(--soft);font-size:13px}
.err{color:var(--copper)}.steps{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}.steps b{font-weight:600}.steps span{color:var(--mute)}
</style></head><body>
<div class="top"><b style="font-size:18px;font-weight:700"><span style="color:var(--violet)">◉</span> Heimdall</b><span class="mono" id="dir" style="color:var(--mute)"></span><div class="tabs" id="tabs"></div><div class="sp"></div><div class="tab" id="wiretoggle" style="color:var(--mute)"></div></div>
<div id="view"></div><div class="needs" id="needs"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const home=h=>String(h).replace(/^db:/,'').replace('/',' · ');
const n=x=>Number(x).toLocaleString('en-US'),ago=t=>{if(!t)return'';const s=(Date.now()-new Date(t))/1000;return s<90?'just now':s<5400?Math.round(s/60)+'m ago':s<129600?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const GLY={NUL:'∅',SIG:'○',INS:'●',SEG:'｜',CON:'⋈',SYN:'△',DEF:'⊢',EVA:'⊨',REC:'◉'};const DOM=['NUL','SIG','INS','SEG','CON','SYN','DEF','EVA','REC'];const domColor=op=>{const i=DOM.indexOf(op);return i<3?'var(--blue)':i<6?'var(--copper)':'var(--violet)'};const glyph=cell=>GLY[String(cell).split('·')[0]]||'·';
const TOKEN='__TOKEN__';
const S={screen:'canvas',data:null,sel:null,kind:null,url:'',pv:null,pvErr:null,busy:false,wiring:false};
const NEEDS={canvas:[['GET /api/canvas','sources, the record, destinations, and the latest gap measured for each']],
 add:[['GET /api/preview?url=','fetches the URL once and shows where each field would land. Nothing is woven'],['POST /api/pull?url=','Start reading: pulls again and weaves one entry']],
 held:[['GET /api/canvas','the gap measure per destination: what the record has that it does not, and the reverse']],
 wiring:[]};
const held=()=>{const out=[];for(const d of S.data.dests){const g=d.gap;if(!g)out.push({d,n:0,title:`${d.name} has never been measured.`,note:'No gap-measured entry for it yet.'});else{if(g.onlyA)out.push({d,n:g.onlyA,title:`${d.name} has not received ${n(g.onlyA)} ${g.onlyA==1?'entry':'entries'} the record holds.`,note:'They are in the record. They are not sent until the destination exchanges.'});if(g.onlyB)out.push({d,n:g.onlyB,title:`${d.name} holds ${n(g.onlyB)} ${g.onlyB==1?'entry':'entries'} the record does not.`,note:'Changed natively in the destination. They flow up on the next exchange.'});if(g.differ)out.push({d,n:g.differ,title:`${d.name} disagrees with the record on ${n(g.differ)} values.`,note:'Both are kept. Neither is assumed right.'})}}return out.filter(h=>h.n)};
function tabs(){const hc=S.data?held().reduce((a,h)=>a+h.n,0):0;const T=[['canvas','Canvas'],['add','Add a source'],['held','Held'+(hc?`<span class="n">${n(hc)}</span>`:'')],['wiring','Wiring']];
 $('#tabs').innerHTML=T.map(([k,l])=>`<div class="tab ${S.screen===k?'on':''}" data-k="${k}">${l}</div>`).join('');$('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.k));
 $('#wiretoggle').textContent=S.wiring?'Hide wiring notes':'Show wiring notes';$('#wiretoggle').onclick=()=>{S.wiring=!S.wiring;needs()}}
function needs(){const N=NEEDS[S.screen]||[];$('#needs').style.display=S.wiring&&N.length?'flex':'none';$('#needs').innerHTML=`<div class="lbl">This screen needs</div>`+N.map(([c,w])=>`<div><span class="mono">${esc(c)}</span><span>${esc(w)}</span></div>`).join('')}
function go(k){S.screen=k;if(k==='add'){S.kind=null;S.pv=null}render()}
function destNode(d){const g=d.gap,ok=g?.ok,w=g&&!ok;return `<div class="node dst ${S.sel==='d'+d.name?'on':''} ${w?'warn':''}" data-s="d${esc(d.name)}"><div class="t">${esc(d.name)}</div><div class="s">${esc(d.engine)} · ${d.tables.length} table${d.tables.length>1?'s':''} · holds ${esc(d.holds)}</div><div class="st ${w?'w':''}">${!g?'Never measured':ok?'In step':`${n((g.onlyA||0)+(g.onlyB||0)+(g.differ||0))} apart`}</div></div>`}
function canvas(){const D=S.data,hc=held().reduce((a,h)=>a+h.n,0);
 const src=D.sources.map(s=>`<div class="node src ${S.sel==='s'+s.name?'on':''}" data-s="s${esc(s.name)}"><div class="t">${esc(s.name)}</div><div class="s">${n(s.n)} pull${s.n>1?'s':''} · ${s.urls.length} address${s.urls.length>1?'es':''}</div><div class="st">Last read ${ago(s.last)}</div></div>`).join('')||`<div class="s" style="color:var(--mute)">Nothing pulled in yet.</div>`;
 const live=D.kinds.slice(0,4).map(k=>`${glyph(k.cell)} ${esc(k.name)} (${n(k.n)})`).join(', ');
 const sel=S.sel?.[0]==='s'?D.sources.find(x=>'s'+x.name===S.sel):S.sel?.[0]==='d'?D.dests.find(x=>'d'+x.name===S.sel):null;
 return `<div class="pane"><div class="board"><div class="cols">
 <div class="col"><div class="lbl">Read from</div>${src}<div class="add" id="addsrc">+ Add a source</div></div>
 <div class="col"><div class="lbl">Kept as one record</div><div class="rec"><div class="big">${esc(D.frame?.name||'the record')}</div><div class="m">${n(D.entries)} entries · nothing is ever overwritten${D.conflicts?` · ${D.conflicts} conflict${D.conflicts>1?'s':''} kept as both`:''}</div>
  <div class="lbl" style="color:var(--darkTx)">Kinds it holds</div><div class="in"><div style="font-weight:600">${D.kinds.length} kinds</div><div class="mono" style="color:var(--darkTx);margin-top:4px;overflow-wrap:anywhere">${live}${D.kinds.length>4?' …':''}</div></div>
  ${hc?`<div class="held" id="goheld">${n(hc)} entries are waiting to cross</div>`:''}<div style="flex:1"></div></div></div>
 <div class="col"><div class="lbl">Shown in</div>${D.dests.map(destNode).join('')||`<div class="s" style="color:var(--mute)">No databases declared.</div>`}<div class="add" style="cursor:default;color:var(--mute)">+ Add a destination: not built yet</div></div>
 </div></div>${sel?detail(sel):''}</div>`}
function detail(x){const isD=!!x.engine,L=isD?[['codec',x.codec],['rows held',n(x.rows)+(x.cuts?` (${x.cuts} cut)`:'')],['writes back',x.writesBack?'Yes: native changes flow up as marks':'Not seen'],['tables',x.tables.join(', ')],x.repo&&['defined by',`${x.repo.repo}@${String(x.repo.commit).slice(0,12)}`],x.gap&&['last measured',`${ago(x.gap.at)} · ${x.gap.measures} measure${x.gap.measures>1?'s':''}`],x.gap&&['only the record has',n(x.gap.onlyA)],x.gap&&['only this node has',n(x.gap.onlyB)]].filter(Boolean):[['addresses',x.urls.join(', ')],['pulls',n(x.n)],['last read',ago(x.last)]];
 return `<div class="card"><div class="lbl">${isD?'Destination':'Source'}</div><div style="font-size:18px;font-weight:600">${esc(x.name)}</div>${L.map(([a,b])=>`<div class="line"><span class="mono">${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div>`}
const TOOLS={'n8n':['n8n','npx n8n@latest','n8n-to-heimdall.workflow.json','Import it, then add a Header Auth credential named Heimdall intake (header X-Heimdall-Token).'],'Node-RED':['node-red','npx node-red@latest','node-red-to-heimdall.flow.json','Import it, and set HEIMDALL_INTAKE_TOKEN in its environment.'],'Activepieces':['activepieces','Docker, see its install docs','(no template)','Add an HTTP step that POSTs to the intake URL with the token header.'],'Any tool (curl)':['curl','','','Anything that can POST JSON works: a script, cron, another service.']};
const KINDS=[['Web address','Any URL that returns JSON or text',1],['n8n','A workflow; its credentials stay in n8n',2],['Node-RED','A flow, runs next to Heimdall',2],['Activepieces','An open-source flow builder',2],['Any tool (curl)','Anything that can POST JSON',2],['GitHub repo','Read-only, pinned to a commit',0],['SQLite file','A node that exchanges both ways',0],['Postgres','Design only: logical replication',0],['Matrix room','Needs a homeserver',0],['Another device','Own devices, cross-signed',0]];
function add(){const steps=['Where is the data?','How it fits the record','Before anything is sent'],cur=!S.kind?0:TOOLS[S.kind]?1:!S.pv?1:2;
 const bar=`<div class="steps">${steps.map((s,i)=>`<b style="font-weight:${i===cur?600:400};color:${i===cur?'var(--ink)':'var(--mute)'}">${s}</b>`).join('<span>→</span>')}</div>`;
 if(TOOLS[S.kind]){const [sys,run,file,how]=TOOLS[S.kind],I=S.data.intake,url=I.url;const curl=`curl -X POST -H 'X-Heimdall-Token: $HEIMDALL_INTAKE_TOKEN' -H 'content-type: application/json' \\\n  -d '{"source":{"system":"${sys}","workflow":"my-workflow"},"items":[{"key":"1","value":{"hello":"world"}}]}' \\\n  ${url}`;
 return `<div class="pane">${bar}<h1>${esc(S.kind)} stores here</h1><p class="lead">The tool does the fetching and holds the credentials (API keys, OAuth, a pasted curl). Its last step posts what it got to Heimdall, which weaves each item into the log. Heimdall never sees the secret.</p>
 <div class="card"><div class="lbl">Status</div><div class="line"><span class="mono">intake</span><span>${I.on?'On':'Off: start Heimdall with HEIMDALL_INTAKE_TOKEN set'}</span></div><div class="line"><span class="mono">writing</span><span>${S.data.door.mode==='off'?'Off: '+esc(S.data.door.why):'On ('+esc(S.data.door.why)+')'}</span></div>${run?`<div class="line"><span class="mono">start it</span><span class="mono">${esc(run)}</span></div>`:''}${file!=='(no template)'&&file?`<div class="line"><span class="mono">template</span><span class="mono">ledgers/heimdall/workflows/${esc(file)}</span></div>`:''}<div class="line"><span class="mono">then</span><span>${esc(how)}</span></div></div>
 <div class="card"><div class="lbl">The call the last step makes</div><pre class="mono" style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:12px">${esc(curl)}</pre><div style="color:var(--mute);font-size:13px">Items with a key that looks like a credential are refused. Contract: ledgers/heimdall/ui/INTAKE.md.</div></div>
 <div><button class="btn g" id="back">Back</button></div></div>`}
 if(!S.kind)return `<div class="pane">${bar}<h1>Where is the data?</h1><div class="kinds">${KINDS.map(([a,b,ok])=>`<div class="kind ${ok?'':'off'}" data-k="${a}" style="${ok?'':'opacity:.55'}">${a}<small>${ok?b:b+' · not wired in this UI yet'}</small></div>`).join('')}</div></div>`;
 if(!S.pv)return `<div class="pane">${bar}<h1>Web address</h1><p class="lead">We fetch it once and match each field against what the record already holds. Nothing is added to the record yet.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input type="text" id="url" placeholder="https://example.org/data.json" value="${esc(S.url)}"><button class="btn" id="go" ${S.busy?'disabled':''}>${S.busy?'Reading…':'Read a sample'}</button><button class="btn g" id="back">Back</button></div>${S.pvErr?`<div class="err">${esc(S.pvErr)}</div>`:''}</div>`;
 const p=S.pv,fields=p.fields,hold=fields.filter(f=>!f.homes.length).length;
 return `<div class="pane">${bar}<h1>How ${esc(new URL(p.url).host)} fits the record</h1><p class="lead">${p.shape}. Fields with no home are held, not dropped. You choose what happens to them.</p>
 <div class="list">${fields.length?fields.map(f=>`<div class="row"><div style="flex:1 1 180px;min-width:0"><div class="mono">${esc(f.field)}</div><div class="mono" style="color:var(--mute)">${esc(f.sample)}</div></div><div style="color:var(--wire)">→</div><div class="pill ${f.homes.length?'':'w'}">${f.homes.length?esc(home(f.homes[0])):'Held'}</div><div style="flex:1 1 220px;color:var(--soft)">${f.homes.length?'A column of this name already exists in '+f.homes.map(home).map(esc).join('; ')+'.':'No destination has a column for this yet.'}</div></div>`).join(''):`<div class="row"><div style="color:var(--soft)">This is ${esc(p.shape)}, so it is kept whole as one bundle of bytes.</div></div>`}</div>
 <div class="card"><div class="lbl">Before anything is sent</div><div class="line"><span class="n1">1</span><span>entry would be woven: kind <b>${esc(p.kind)}</b> at ${esc(p.cell)}, address <span class="mono">${esc(p.addr)}</span></span></div>
 <div class="line"><span class="n1 ${hold?'w':''}">${hold}</span><span>${hold?'fields have no home and would be held':'fields without a home'}</span></div><div class="line"><span class="mono">sha256</span><span class="mono">${p.sha256.slice(0,32)}…</span></div><div class="line"><span class="mono">how</span><span class="mono">${esc(p.how)}</span></div></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" id="start" ${(S.data.door.mode==='off'||S.busy)?'disabled':''} title="${esc(S.data.door.mode==='off'?S.data.door.why:'Weaves one entry into the log')}">${S.busy?'Weaving…':'Start reading'}</button><button class="btn g" id="again">Read a different address</button><span style="color:var(--mute);font-size:13px">${S.data.door.mode==='off'?`Writing is off: ${esc(S.data.door.why)}. This screen only previews.`:`Writing on (${esc(S.data.door.mode)}). One entry is woven by Heimdall's server, never by this page.`}</span>${S.wovenErr?`<div class="err" style="flex-basis:100%">${esc(S.wovenErr)}</div>`:''}</div></div>`}
function heldScreen(){const H=held();return `<div class="pane"><div><h1>Held</h1><p class="lead">What has not crossed yet. It is all in the record already; nothing is sent until the destination exchanges. The measure is revisable, never a verdict.</p></div>
 ${H.map(h=>`<div class="card"><div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span style="font-size:22px;font-weight:600;color:var(--warn)">${n(h.n)}</span><span style="font-size:15px;font-weight:600;flex:1 1 300px">${esc(h.title)}</span></div><div style="color:var(--soft)">${esc(h.note)}</div><div class="mono" style="color:var(--mute)">measured ${ago(h.d.gap?.at)} · frontier-to-frontier</div></div>`).join('')||`<div style="color:var(--soft)">Nothing is held. Every measured destination is in step.</div>`}</div>`}
const PROMISES=[['The record is append-only','Sources add entries; nothing is overwritten. A removal is a typed cut.'],['Every pull names its bytes','URL, status, type and sha256 travel with the entry so it can be re-checked.'],['A destination is a node','It holds its own view and exchanges by union. No node is the truth.'],['Gaps are measured, not declared','Each exchange can reopen the gap between two nodes.'],['Heimdall writes only its own entries','Verdicts are Penelope's; Heimdall records what it pulled and nothing more.'],['No wrong door','Any database, API or device that has a codec can be a source or a destination.']];
const CALLS=[['canvas','GET /api/canvas','the three columns'],['add','GET /api/preview?url=','sample and mapping, nothing woven'],['held','GET /api/canvas','gap per destination'],['add','POST /api/pull?url= (weave as the heimdall writer)','Start reading; needs --write'],['canvas','POST exchange (lib/spawn.mjs exchange)','not built here: sync now']];
function wiring(){return `<div class="pane"><div><h1>What the backend has to provide</h1><p class="lead">Six promises these screens depend on, and the calls that exist today. One call (sync now) is not built into this UI.</p></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 28px">${PROMISES.map(([t,d])=>`<div style="border-top:1px solid var(--ink);padding-top:10px"><div style="font-weight:600">${t}</div><div style="color:var(--soft);margin-top:4px">${d}</div></div>`).join('')}</div>
 <div class="lbl">Calls, by screen</div><div class="list">${CALLS.map(([s,c,w])=>`<div class="row"><span style="flex:0 0 90px;color:var(--mute)">${s}</span><span class="mono" style="flex:1 1 280px">${esc(c)}</span><span style="flex:1 1 240px;color:var(--soft)">${esc(w)}</span></div>`).join('')}</div></div>`}
function render(){tabs();needs();const v=$('#view');v.innerHTML=!S.data?'<div class="pane">Loading…</div>':{canvas,add,held:heldScreen,wiring}[S.screen]();
 v.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.sel=S.sel===e.dataset.s?null:e.dataset.s;render()});
 v.querySelector('#addsrc')?.addEventListener('click',()=>go('add'));v.querySelector('#goheld')?.addEventListener('click',()=>go('held'));
 v.querySelectorAll('.kind').forEach(e=>e.onclick=()=>{if(e.dataset.k==='Web address'||TOOLS[e.dataset.k]){S.kind=e.dataset.k;render()}});
 v.querySelector('#back')?.addEventListener('click',()=>{S.kind=null;render()});v.querySelector('#again')?.addEventListener('click',()=>{S.pv=null;render()});
 v.querySelector('#start')?.addEventListener('click',async()=>{S.busy=true;S.wovenErr=null;render();const r=await (await fetch('/api/pull?url='+encodeURIComponent(S.pv.url),{method:'POST',headers:{'x-heimdall-token':TOKEN}})).json();S.busy=false;if(r.ok){S.pv=null;S.kind=null;S.screen='canvas';await load();render()}else{S.wovenErr=r.error||`Refused: ${r.reason} ${r.detail||''}`;render()}});
 const go_=v.querySelector('#go'),inp=v.querySelector('#url');if(inp){inp.focus();inp.oninput=()=>S.url=inp.value;inp.onkeydown=e=>{if(e.key==='Enter')go_.click()}}
 if(go_)go_.onclick=async()=>{S.url=inp.value.trim();S.busy=true;S.pvErr=null;render();const r=await (await fetch('/api/preview?url='+encodeURIComponent(S.url))).json();S.busy=false;if(r.error)S.pvErr=r.error;else S.pv=r;render()}}
async function load(){const d=await (await fetch('/api/canvas')).json();const first=!S.data;S.data=d;$('#dir').textContent=d.dir;if(first||S.screen!=='add')render()}
load();setInterval(load,4000);
</script></body></html>
